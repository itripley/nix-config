# ── output ─────────────────────────────────────────────────────
vo=gpu-next
gpu-api=vulkan
profile=high-quality      # sane baseline, overridden below
hwdec=auto-safe

# ── scaling ────────────────────────────────────────────────────
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=hermite            # mpv's current default downscaler
scale-antiring=0.6
cscale-antiring=0.6
dscale-antiring=0.6
correct-downscaling=yes    # on by default; keep it
linear-downscaling=yes
sigmoid-upscaling=yes      # on by default

# ── HDR → SDR ──────────────────────────────────────────────────
target-colorspace-hint=no  # never hand HDR to an SDR display
tone-mapping=spline
tone-mapping-mode=hybrid
gamut-mapping-mode=perceptual
hdr-compute-peak=yes       # per-scene dynamic tone mapping
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
target-peak=200            # ← your display's real peak white
target-contrast=auto

# ── banding & dither ───────────────────────────────────────────
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=4
dither-depth=auto

# ── timing ─────────────────────────────────────────────────────
video-sync=display-resample
interpolation=no          # only turn on if stuck at fixed 60 Hz

# Anime: heavier deband for flat cel art
[anime]
profile-cond=path ~= nil and path:lower():find("anime") ~= nil
profile-restore=copy
deband-threshold=48

# Native 4K: nothing to upscale, and grain is detail
[uhd]
profile-cond=width >= 3000
profile-restore=copy
glsl-shaders=""
deband=no

# SD sources: worst encodes in the library, work them hardest
[sd]
profile-cond=width <= 1024
profile-restore=copy
deband-threshold=64
deband-iterations=3
