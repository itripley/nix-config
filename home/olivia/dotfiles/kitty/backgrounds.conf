# WezTerm's backgrounds in kitty, included from ~/.config/kitty/kitty.conf
# How strong the images are: STRENGTH in backgrounds.py. How much blur shows: background_opacity
background_tint 0
background_opacity 0.70
geninclude backgrounds.py
background_image_layout cscaled
background_image_linear yes

# As in WezTerm: random, previous, next; Alt+B turns the image off
map alt+/ load_config_file
map alt+, remote_control set-background-image -- -1
map alt+. remote_control set-background-image +1
map alt+b remote_control set-background-image none
