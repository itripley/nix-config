# WezTerm's backgrounds in kitty, included from ~/.config/kitty/kitty.conf
# How strong the images are: STRENGTH in backgrounds.py. How much blur shows: background_opacity
background_tint 0
background_opacity 0.78
geninclude backgrounds.py
background_image_layout cscaled
background_image_linear yes

# Each tab has its own image
watcher ~/nix-config/home/olivia/dotfiles/kitty/tab_backgrounds.py

# As in WezTerm, for this tab: random, previous, next; Alt+B turns the image off
map alt+/ kitten ~/nix-config/home/olivia/dotfiles/kitty/tab_backgrounds.py random
map alt+, kitten ~/nix-config/home/olivia/dotfiles/kitty/tab_backgrounds.py -1
map alt+. kitten ~/nix-config/home/olivia/dotfiles/kitty/tab_backgrounds.py +1
map alt+b kitten ~/nix-config/home/olivia/dotfiles/kitty/tab_backgrounds.py off
