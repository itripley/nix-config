# Evaluates the whole system and lints the repo on every push/PR. It doesn't build the system
# (40+ GiB, and unfree apps like Resolve aren't in the binary cache), only `nix flake check`:
# checks.toplevel-eval (every .drv instantiated) + checks.lint (statix, deadnix, nixfmt).
name: check
on:
  push:
  pull_request:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
